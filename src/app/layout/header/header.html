<mat-toolbar class="header">

  @if (envName !== 'PROD') {    
    <div class="env-ribbon-wrap">
      <div class="env-ribbon" [ngClass]="envClass()">
        {{ envName }}
      </div>
    </div>
  }

  <div class="header-left">
    <img src="logo.png" alt="Logo AR-WC3" class="logo" />
  </div>

  <span class="spacer"></span>

  <div class="header-right">
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-trigger">
      <mat-icon>account_circle</mat-icon>
      <span class="username">{{ currentUser()?.displayName ?? 'Utilisateur' }}</span>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Se déconnecter</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
