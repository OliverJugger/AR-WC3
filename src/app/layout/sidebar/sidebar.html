<nav class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-header">
    <button
      mat-icon-button
      class="collapse-toggle"
      (click)="toggleCollapsed()"
      [attr.aria-label]="collapsed() ? 'Déplier le menu' : 'Replier le menu'">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-form-field class="sidebar-search" appearance="outline">
      <input 
        matInput 
        type="search"
        [value]="searchSignal()"
        (input)="searchSignal.set($any($event.target).value)"
        placeholder="pv22, sinistre..."
        #searchInput>
      @if (searchSignal()) {
        <button
          mat-icon-button 
          matSuffix
          (click)="clearSearch(searchInput)" 
          aria-label="Effacer">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
      
    <!-- <button
      mat-icon-button
      (click)="collapseAllMenu()" 
      class="collapse"
      aria-label="collapse all">
      <mat-icon>unfold_less</mat-icon>
    </button> -->
  </div>

  <mat-divider></mat-divider>

  @if (!collapsed()) {
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="nav-tree">
      <!-- Feuille : lien de navigation -->
      <mat-tree-node 
        *matTreeNodeDef="let node"
        matTreeNodePadding 
        [matTreeNodePaddingIndent]="14" 
        class="tree-node"
        >

        <a
          class="tree-leaf"
          [routerLink]="node.route"
          [class.highlighted]="node.highlighted"
          routerLinkActive="active-link"
          [matTooltip]="(node.name) + ' (' + (node.code_arthus) + ')'"
          matTooltipPosition="right"
          matTooltipShowDelay="300"
        >
          <span class="tree-label">{{ node.name }}</span>
        </a>
      </mat-tree-node>

      <!-- Branche : nœud dépliable -->
      <mat-tree-node
        *matTreeNodeDef="let node; when: hasChild"
        matTreeNodePadding
        [matTreeNodePaddingIndent]="14"
        class="tree-node tree-branch"
      >
        <button
          mat-icon-button
          matTreeNodeToggle
          class="tree-toggle"
          [class.highlighted]="node.highlighted"
          [attr.aria-label]="(treeControl.isExpanded(node) ? 'Replier ' : 'Déplier ') + node.name"
        >
          <mat-icon>{{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}</mat-icon>
        </button>
        <span class="tree-label" 
          [matTooltip]="(node.name) + ' (' + (node.code_arthus) + ')'"
          matTooltipPosition="right" 
          matTooltipShowDelay="300">
          {{ node.name }}
        </span>
      </mat-tree-node>
    </mat-tree>
  }
</nav>
