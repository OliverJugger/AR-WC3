openapi: 3.0.3
info:
  title: AR-WC3 API
  description: >
    Contrat OpenAPI de l'application AR-WC3. Ce contrat est la source de
    vérité pour le client HTTP généré côté Angular (voir `ng-openapi-gen.json`)
    ainsi que pour le serveur mocké Mockoon (voir `mockoon/environment.json`).
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Serveur mocké (Mockoon)

tags:
  - name: auth
    description: Authentification
  - name: prestations-prevoyance
    description: Prestations prevoyance
  - name: statistics
    description: Statistiques du tableau de bord

paths:
  /login:
    post:
      tags: [auth]
      summary: Authentifie un utilisateur
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /prestations-prevoyance/pv22:
    get:
      tags: [prestations-prevoyance]
      summary: Récupère les sinistres
      operationId: getPv22
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiques des sinistres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pv22Response'

  /statistics:
    get:
      tags: [statistics]
      summary: Récupère les statistiques utilisées par les 4 graphiques du tableau de bord
      operationId: getStatistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiques du tableau de bord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'

                

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:  
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: olivier.mignot83
        password:
          type: string
          format: password
          example: '********'

    LoginResponse:
      type: object
      required:
        - success
        - token
        - user
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: mock-jwt-token
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      required:
        - username
        - displayName
      properties:
        username:
          type: string
          example: olivier.mignot83
        displayName:
          type: string
          example: Olivier Mignot
        avatarInitials:
          type: string
          example: OM

    PaginatedResponse:
      type: object
      required :
        - page
        - pageSize
        - count
        - totalCount
      properties:
        page:
          type: number
        pageSize:
          type: number
        count:
          type: number
        totalCount:
          type: number
    
    Pv22Data:
      type: object
      required :
        - id
        - assure_number
        - assure_name
        - start_date
        - end_date
        - cloture_date
      properties:
        id:
          type: number
        assure_number:
          type: number
        assure_name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        cloture_date:
          type: string
          format: date

    Pv22Response:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
        - properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Pv22Data'

    ChartDatum:
      type: object
      description: Un point de données pour un graphique de type "pie"
      required:
        - name
        - value
      properties:
        name:
          type: string
          example: Catégorie A
        value:
          type: number
          format: double
          example: 42

    StatisticsResponse:
      type: object
      required:
        - stat1
        - stat2
        - stat3
        - stat4
      properties:
        stat1:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'
        stat2:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'
        stat3:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'
        stat4:
          type: array
          items:
            $ref: '#/components/schemas/ChartDatum'

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Identifiants invalides
